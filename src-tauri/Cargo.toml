[package]
name = "zk-note"
# 앱 버전의 source of truth 는 루트 package.json 이다 (tauri.conf.json 이 그 경로를 가리킨다).
# 이 값은 crate 메타데이터일 뿐 앱 버전으로 쓰이지 않으므로 bump 하지 않는다.
version = "0.1.0"
description = "ZK-Note — markdown note app"
authors = ["zerokoo"]
edition = "2021"

[lib]
name = "zk_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zk-note"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
